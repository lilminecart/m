<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>&#8203;</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:light}
html,body{height:100%;margin:0;background:#fafafa}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:0 16px}
#p{width:132px;height:132px;border:1px solid #b5b5b5;background:transparent;border-radius:0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent;transition:border-color .2s}
#p:hover,#p:active{border-color:#8a8a8a}
#p svg{width:48px;height:48px;fill:none;stroke:#9a9a9a;stroke-width:1;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
audio{width:100%;max-width:420px;opacity:.75}
</style>
</head><body>
<button id="p" type="button" aria-label="Play">
  <svg id="i" viewBox="0 0 48 48"><path vector-effect="non-scaling-stroke" d="M16 10 L38 24 L16 38 Z"/></svg>
</button>
<audio id="a" controls playsinline preload="metadata" src="a.mp3"></audio>
<script>
var a=document.getElementById('a'),p=document.getElementById('p'),i=document.getElementById('i');
var PLAY='<path vector-effect="non-scaling-stroke" d="M16 10 L38 24 L16 38 Z"/>',
    PAUSE='<path vector-effect="non-scaling-stroke" d="M15 11 H20 V37 H15 Z M28 11 H33 V37 H28 Z"/>';
p.onclick=function(){if(a.paused){a.play();}else{a.pause();}};
a.onplay=function(){i.innerHTML=PAUSE;p.setAttribute('aria-label','Pause');};
a.onpause=a.onended=function(){i.innerHTML=PLAY;p.setAttribute('aria-label','Play');};
</script>
</body></html>
